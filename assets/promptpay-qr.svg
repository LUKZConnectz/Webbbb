<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 1080" role="img" aria-labelledby="title desc">
  <title id="title">Thai QR Payment PromptPay</title>
  <desc id="desc">PromptPay Thai QR Payment card for นาย ธัญพิสิษฐ์ นิลวงษ์</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eefcff"/><stop offset="1" stop-color="#e8fbff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#88b9c4" flood-opacity=".32"/></filter>
    <pattern id="qr" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#fff"/><path d="M0 0h12v12H0zm24 0h12v12H24zM12 12h12v12H12zM0 24h12v12H0zm24 24" fill="#000"/>
    </pattern>
  </defs>
  <rect width="830" height="1080" fill="url(#bg)"/>
  <text x="415" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#0c4c72">make</text>
  <text x="415" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#7b8792">by <tspan font-weight="700" fill="#253344">KBank</tspan></text>
  <g filter="url(#shadow)">
    <rect x="120" y="210" width="590" height="820" rx="32" fill="#fff"/>
    <path d="M152 210h526a32 32 0 0 1 32 32v96H120v-96a32 32 0 0 1 32-32z" fill="#174d76"/>
    <text x="395" y="267" font-family="Arial, sans-serif" font-size="35" font-weight="800" fill="#fff">THAI QR</text>
    <text x="395" y="305" font-family="Arial, sans-serif" font-size="35" font-weight="800" fill="#fff">PAYMENT</text>
    <rect x="345" y="370" width="140" height="45" fill="#fff" stroke="#28465a" stroke-width="2"/>
    <text x="415" y="401" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#28465a">PromptPay</text>
    <g transform="translate(282 445)">
      <rect width="266" height="266" fill="url(#qr)"/>
      <rect x="0" y="0" width="72" height="72" fill="#000"/><rect x="12" y="12" width="48" height="48" fill="#fff"/><rect x="24" y="24" width="24" height="24" fill="#000"/>
      <rect x="194" y="0" width="72" height="72" fill="#000"/><rect x="206" y="12" width="48" height="48" fill="#fff"/><rect x="218" y="24" width="24" height="24" fill="#000"/>
      <rect x="0" y="194" width="72" height="72" fill="#000"/><rect x="12" y="206" width="48" height="48" fill="#fff"/><rect x="24" y="218" width="24" height="24" fill="#000"/>
      <circle cx="133" cy="133" r="30" fill="#fff" opacity=".88"/><text x="133" y="146" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#1a83b5">m</text>
    </g>
    <text x="415" y="770" text-anchor="middle" font-family="Noto Sans Thai, Arial, sans-serif" font-size="32" font-weight="800" fill="#3e4652">นาย ธัญพิสิษฐ์ นิลวงษ์</text>
    <text x="415" y="815" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#7e8793">XXX-X-X8333-X</text>
    <text x="415" y="855" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#c0c4ca">เลขที่อ้างอิง 004666005541051</text>
    <line x1="152" y1="890" x2="678" y2="890" stroke="#e6e7e9" stroke-width="2"/>
    <text x="153" y="950" font-family="Noto Sans Thai, Arial, sans-serif" font-size="23" fill="#6f7782">สามารถสแกน QR เพื่อโอนเงินเข้าบัญชี</text>
    <text x="153" y="983" font-family="Noto Sans Thai, Arial, sans-serif" font-size="23" fill="#6f7782">ได้จากทุกธนาคาร</text>
  </g>
</svg>
