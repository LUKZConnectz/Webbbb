<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบหลังบ้าน | Freal Boxser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+Thai:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body data-protected="true" data-page="admin" class="admin-page">
  <header class="site-header admin-header">
    <div class="header-inner">
      <a class="logo" href="index.html" aria-label="Freal Boxser home"><span class="logo-main">FREAL</span><span class="logo-sub">BOXSER</span></a>
      <nav class="toolbar" aria-label="admin actions">
        <a class="pill ghost-pill" href="index.html"><i data-lucide="store"></i>หน้าร้าน</a>
        <button class="pill user-pill" type="button"><span class="avatar"><i data-lucide="shield-user" aria-hidden="true"></i></span><span data-username>admin</span></button>
        <button class="pill" type="button" data-logout>ออกจากระบบ</button>
      </nav>
    </div>
  </header>

  <main class="admin-shell">
    <section class="admin-hero" aria-labelledby="admin-title">
      <span class="login-kicker">Back Office</span>
      <h1 id="admin-title">ระบบหลังบ้านแยกสำหรับจัดการร้าน</h1>
      <p>ดูภาพรวมยอดขาย จัดการคำสั่งซื้อ สินค้า และผู้ใช้งานได้ในหน้าเดียว พร้อมรองรับมือถือ</p>
    </section>

    <section class="admin-metrics" aria-label="admin metrics">
      <article><span>คำสั่งซื้อ</span><strong data-admin-orders>0</strong></article>
      <article><span>ยอดขายรวม</span><strong data-admin-sales>฿ 0.00</strong></article>
      <article><span>สินค้า</span><strong>10</strong></article>
      <article><span>ผู้ดูแล</span><strong>1</strong></article>
    </section>

    <section class="admin-grid">
      <article class="admin-panel">
        <div class="panel-head"><h2><i data-lucide="package-check"></i>จัดการคำสั่งซื้อ</h2><button class="pill" type="button" data-admin-refresh>รีเฟรช</button></div>
        <div class="admin-orders" data-admin-order-list></div>
      </article>

      <article class="admin-panel">
        <div class="panel-head"><h2><i data-lucide="boxes"></i>จัดการสินค้า</h2></div>
        <form class="admin-form" data-admin-product-form>
          <label>ชื่อสินค้า<input name="product-name" value="Night Vision Goggles" /></label>
          <label>ราคา<input name="product-price" type="number" value="3500" /></label>
          <button class="pill" type="submit"><i data-lucide="save"></i>บันทึกสินค้า</button>
        </form>
      </article>

      <article class="admin-panel">
        <div class="panel-head"><h2><i data-lucide="users"></i>ผู้ใช้งานล่าสุด</h2></div>
        <div class="admin-user-card"><span class="avatar"><i data-lucide="badge-user"></i></span><div><strong data-username>ผู้ใช้งาน</strong><p>ล็อคอินล่าสุดจากอุปกรณ์นี้</p></div></div>
      </article>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
