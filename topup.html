<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เติมเงินและเพิ่มแต้ม | Freal Boxser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+Thai:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body data-protected="true">
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html" aria-label="Freal Boxser home">
        <span class="logo-main">FREAL</span>
        <span class="logo-sub">BOXSER</span>
      </a>

      <nav class="toolbar" aria-label="user actions">
        <button class="pill user-pill" type="button">
          <span class="avatar"><i data-lucide="badge-user" aria-hidden="true"></i></span>
          <span data-username>cvoppy</span>
        </button>
        <button class="pill" type="button" data-logout>ออกจากระบบ</button>
        <div class="toolbar-icons">
          <a class="icon-btn icon-link" href="cart.html" aria-label="ตะกร้าสินค้า"><i data-lucide="shopping-basket" aria-hidden="true"></i></a>
          <a class="icon-btn icon-link" href="orders.html" aria-label="คำสั่งซื้อ"><i data-lucide="message-square-text" aria-hidden="true"></i></a>
          <a class="icon-btn icon-link" href="topup.html" aria-label="เติมเงิน"><i data-lucide="piggy-bank" aria-hidden="true"></i></a>
          <a class="icon-btn icon-link" href="admin.html" aria-label="ระบบหลังบ้าน"><i data-lucide="settings" aria-hidden="true"></i></a>
          <button class="icon-btn" type="button" aria-label="ตั้งค่าธีม"><i data-lucide="sun-medium" aria-hidden="true"></i></button>
        </div>
      </nav>
    </div>
  </header>

  <main class="topup-shell">
    <section class="topup-card" aria-labelledby="topup-title">
      <h1 id="topup-title">
        <span class="wallet-icon" aria-hidden="true"><i data-lucide="wallet-cards"></i></span>
        เติมเงินและเพิ่มแต้ม
      </h1>
      <form class="topup-form" data-topup-form action="#" method="post">
        <label class="sr-only" for="slip-url">ลิงก์อั่งเปา</label>
        <input id="slip-url" name="slip-url" type="url" placeholder="ลิงก์อั่งเปา" autocomplete="off" />
        <button class="pill topup-submit" type="submit"><i data-lucide="badge-plus" aria-hidden="true"></i>เติมเงิน</button>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
